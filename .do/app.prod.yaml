alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED

features:
- buildpack-stack=ubuntu-22

ingress:
  rules:
  # Retire the starter hostname. A PRIMARY domain does not switch it off, so
  # without this the app answers identically on two origins and the canonical
  # tag is the only thing telling search engines which is real.
  #
  # This rule is first deliberately. DigitalOcean does not document whether
  # rules are evaluated in order or by specificity, and this placement is
  # correct under either reading: it is both earlier and a stricter authority
  # match than the catch-all below.
  #
  # `${STARTER_DOMAIN}` is not decoration and cannot be replaced by the literal
  # hostname: the API rejects any authority that is not a custom domain in this
  # spec, with `Authority "…" does not have a matching custom domain`. It is
  # resolved by DigitalOcean, which is also why recreating this app — and
  # minting a new random suffix — needs no edit here.
  #
  # It does need help surviving the trip. The deploy action expands the spec
  # through os.Expand and keeps only dotted keys as bindables, so a plain
  # ${STARTER_DOMAIN} would arrive empty — and an empty authority matches
  # everything, turning this rule into a redirect loop on the custom domain.
  # deploy-prod.yml therefore sets STARTER_DOMAIN to the literal string
  # "${STARTER_DOMAIN}", so the expansion replaces it with itself.
  - match:
      authority:
        exact: ${STARTER_DOMAIN}
      path:
        prefix: /
    redirect:
      authority: farkle.iamxox.space
      redirect_code: 301
  - component:
      name: farkle
    match:
      authority:
        exact: ""
      path:
        prefix: /

name: farkle-prod
region: fra

domains:
# Depends on a CNAME that already exists in Cloudflare:
#   farkle.iamxox.space  CNAME  farkle-prod-fec6b.ondigitalocean.app  (DNS only)
# Order matters — DigitalOcean verifies the record before it will issue a
# certificate, so adding this block first only parks the domain in verification
# and fires the DOMAIN_FAILED alert.
#
# The record must stay unproxied while the certificate is issued: behind
# Cloudflare's proxy the CA's HTTP validation reaches Cloudflare rather than
# App Platform and never completes. DigitalOcean picks the CA — the certificate
# it issued here came from Google Trust Services, not Let's Encrypt as an
# earlier version of this comment guessed.
- domain: farkle.iamxox.space
  type: PRIMARY
  # No `zone`: that field is for domains whose nameservers DigitalOcean runs,
  # and these are Cloudflare's.
  #
  # PRIMARY names the domain, it does not retire the starter one — see the
  # ingress redirect above, which does.

static_sites:
- name: farkle
  environment_slug: node-js
  github:
    repo: artem-xox/farkle
    # An App Platform GitHub source names a *branch*, never a commit, and
    # DigitalOcean resolves it to the tip when the build runs — the deploy
    # action even forces `UpdateAllSourceVersions`. So prod ships whatever
    # `main` points at the moment somebody presses the button, and this line is
    # why deploy-prod.yml pins its own checkout to `main` too: anything else
    # would test one commit and deploy another.
    branch: main
    # The button is the only trigger. Left true, DigitalOcean's own webhook
    # would deploy prod on every push to main and there would be no button at
    # all — this single field is what separates prod from dev.
    deploy_on_push: false
  source_dir: /
  build_command: npm ci && npm run build -w @farkle/web
  output_dir: apps/web/dist
  catchall_document: index.html
  envs:
  - key: SITE_URL
    scope: BUILD_TIME
    value: https://farkle.iamxox.space
  - key: SITE_INDEXABLE
    scope: BUILD_TIME
    value: "true"
