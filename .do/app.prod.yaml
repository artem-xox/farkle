alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED

features:
- buildpack-stack=ubuntu-22

ingress:
  rules:
  - component:
      name: farkle
    match:
      authority:
        exact: ""
      path:
        prefix: /

name: farkle-prod
region: fra

# The custom domain lands here once farkle.iamxox.space has a CNAME pointing at
# this app's ondigitalocean.app hostname — which cannot be known until the first
# deploy has created the app. Adding the block before the DNS record exists just
# leaves the domain stuck in verification and fires the DOMAIN_FAILED alert.
#
# domains:
# - domain: farkle.iamxox.space
#   type: PRIMARY
#   # No `zone`: DNS lives at Cloudflare, not in DigitalOcean's own DNS.

static_sites:
- name: farkle
  environment_slug: node-js
  github:
    repo: artem-xox/farkle
    # An App Platform GitHub source names a *branch*, never a commit, and
    # DigitalOcean resolves it to the tip when the build runs — the deploy
    # action even forces `UpdateAllSourceVersions`. So prod ships whatever
    # `main` points at the moment somebody presses the button, and this line is
    # why deploy-prod.yml pins its own checkout to `main` too: anything else
    # would test one commit and deploy another.
    branch: main
    # The button is the only trigger. Left true, DigitalOcean's own webhook
    # would deploy prod on every push to main and there would be no button at
    # all — this single field is what separates prod from dev.
    deploy_on_push: false
  source_dir: /
  build_command: npm ci && npm run build -w @farkle/web
  output_dir: apps/web/dist
  catchall_document: index.html
  envs:
  - key: SITE_URL
    scope: BUILD_TIME
    value: https://farkle.iamxox.space
  - key: SITE_INDEXABLE
    scope: BUILD_TIME
    value: "true"
