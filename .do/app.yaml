name: farkle
region: fra

static_sites:
  - name: web
    github:
      repo: artem-xox/farkle
      branch: main
      # Deploys are triggered by GitHub Actions after tests pass
      # (.github/workflows/ci.yml), not by DigitalOcean's own push webhook.
      deploy_on_push: false
    build_command: npm ci && npm run build -w @farkle/web
    output_dir: apps/web/dist
    catchall_document: index.html
