name: Deploy to production

# The button. Prod has no automatic trigger at all: `.do/app.prod.yaml` sets
# `deploy_on_push: false`, so DigitalOcean never deploys farkle-prod off its own
# webhook, and nothing in ci.yml touches the prod spec. This workflow is the
# only path to farkle.iamxox.space.
on:
  workflow_dispatch:

# Two prod deploys at once would race for the same app. Queue rather than
# cancel: a half-applied spec is worse than waiting.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Requires a reviewer's approval before any step runs — see
    # Settings → Environments → production. The environment is also where a
    # prod-scoped DIGITALOCEAN_ACCESS_TOKEN would live if the repository secret
    # is ever narrowed.
    environment: production
    permissions:
      contents: read
    steps:
      # Pinned to `main` rather than the dispatch ref on purpose. The prod spec
      # says `branch: main`, so DigitalOcean builds main whichever branch this
      # run was launched from; checking out anything else would run the suite
      # against one commit and ship another.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Record what is being deployed
        run: |
          {
            echo "Deploying \`$(git rev-parse --short HEAD)\` to production"
            echo
            git log -1 --pretty='%s%n%n%an, %ad' --date=short
          } >> "$GITHUB_STEP_SUMMARY"

      # main is already green — ci.yml gated the merge — but it was green on the
      # merge commit, not necessarily on today's tip after several merges, and
      # this is the last chance to find that out cheaply.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Deploy app spec
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          # Smuggles `${STARTER_DOMAIN}` past the action intact. It runs the
          # spec through Go's os.Expand and substitutes any `${NAME}` it finds;
          # names are only left alone if they contain a dot (DigitalOcean's
          # bindables) or are one of APP_DOMAIN/APP_URL/APP_ID. STARTER_DOMAIN
          # is neither, so it would be replaced with the empty string — and an
          # empty authority in the ingress rule matches every request, which
          # would 301 the custom domain to itself. Setting the variable to its
          # own placeholder makes the substitution a no-op.
          STARTER_DOMAIN: '${STARTER_DOMAIN}'
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.prod.yaml
          print_build_logs: true
          # The `farkle` project — see the note in ci.yml. This only bites once,
          # on the run that creates the app, and it already bit: the first prod
          # deploy created farkle-prod in the default project because this line
          # was missing. Deleting the app and re-running is what puts it right;
          # adding the id alone moves nothing.
          project_id: 95f07e53-8bdc-41ee-a053-00497fce225e

      # The action reports success once DigitalOcean says the deployment is
      # ACTIVE, which is not the same as the site answering. Fetch the app's own
      # live URL rather than the custom domain, so this still works before DNS
      # exists and keeps working if the domain is ever moved.
      #
      # The app JSON goes through the environment, not through `${{ }}` inside
      # the script: interpolating it directly would splice a DigitalOcean API
      # response into a shell command.
      - name: Smoke check
        env:
          APP: ${{ steps.deploy.outputs.app }}
        run: |
          # Everything here retries, because the gap this step exists to cover
          # is exactly a gap it can fall into. DigitalOcean calls a deployment
          # ACTIVE before the edge serves it, and for the ~seconds in between
          # the old URL answers 200 with content that is not the new build.
          # curl's own --retry is no help: it retries transport errors and 5xx,
          # never a 200 whose body is wrong, which is the failure that actually
          # happened here. So the assertion is what retries, not the request.
          retry() {
            local what=$1; shift
            local attempt
            for attempt in $(seq 1 12); do
              if "$@"; then
                # Not `[ … ] && echo …`: the step runs under `bash -e`, where a
                # standalone && list whose test fails returns 1 and takes the
                # whole script down with it.
                if [ "$attempt" -gt 1 ]; then
                  echo "$what: settled after $attempt attempts"
                fi
                return 0
              fi
              echo "$what: not ready yet (attempt $attempt)"
              sleep 5
            done
            echo "$what: still wrong after 12 attempts"
            return 1
          }

          # `//` only falls through on null, and the action leaves live_url as
          # an empty string when the app has no ingress yet, so filter by value.
          url=$(jq -er '[.live_url, .default_ingress]
                        | map(select(. != null and . != "")) | first' <<<"$APP")

          # `<div id="root">` alone is not evidence the site works, and trusting
          # it shipped a white screen: App Platform's CDN held an index.html
          # from the previous build for `s-maxage=86400`, that document named
          # asset filenames this build had deleted, and `catchall_document`
          # answered each of them with index.html at 200. The browser refuses to
          # run HTML as a module script, so the page rendered blank — while the
          # old marker sat in the stale document, passing this check.
          #
          # So follow the document to the files it actually depends on. A hashed
          # asset that comes back as text/html is the catch-all standing in for
          # something missing, which means the document and the build it is
          # being served beside do not match.
          serving() {
            local base=${1%/} body path type found=0
            body=$(curl --fail --silent --location "$base") || return 1
            grep -q '<div id="root">' <<<"$body" || return 1

            while read -r path; do
              found=1
              type=$(curl --silent --location --output /dev/null \
                          --write-out '%{content_type}' "$base$path")
              case "$type" in
                text/html*)
                  echo "  $path served as $type — stale document or missing asset"
                  return 1
                  ;;
              esac
            done < <(grep -oE '/assets/[A-Za-z0-9._-]+' <<<"$body" | sort -u)

            # A build with no hashed assets at all is not a build worth shipping.
            [ "$found" = 1 ]
          }

          echo "Checking $url"
          retry "$url" serving "$url"
          echo "Prod is serving from $url" >> "$GITHUB_STEP_SUMMARY"

          # Once a custom domain is attached, the starter hostname should 301 to
          # it rather than serve a duplicate. `--location` is deliberately absent
          # so this reads the redirect itself instead of following it — and it
          # would also catch the rule matching too broadly, which would turn the
          # check above into a redirect loop.
          redirects_to() {
            local code target
            read -r code target < <(
              curl --silent --output /dev/null \
                   --write-out '%{http_code} %{redirect_url}' "$1"
            )
            echo "  $1 -> $code $target"
            [ "$code" = "301" ] || return 1
            case "$target" in "$2"/*|"$2") ;; *) return 1 ;; esac
          }

          starter=$(jq -r '.default_ingress // ""' <<<"$APP")
          if [ -n "$starter" ] && [ "$starter" != "$url" ]; then
            echo "Checking $starter redirects to $url"
            retry "$starter" redirects_to "$starter" "$url"
            echo "Starter hostname 301s to $url" >> "$GITHUB_STEP_SUMMARY"
          fi
