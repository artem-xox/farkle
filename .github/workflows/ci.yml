name: CI

on:
  push:
    branches: ['**']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to DigitalOcean
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # `app_spec_location` and `app_name` are mutually exclusive, and picking
      # the wrong one inverts what deploys: given `app_name`, the action pulls
      # the spec off the *live app* and the in-repository spec is ignored
      # entirely. That is how `.do/app.yaml` sat unapplied long enough for the
      # live app to drift back to `deploy_on_push: true`. Point at the file.
      - name: Deploy app spec
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.dev.yaml
