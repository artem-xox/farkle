name: CI

on:
  push:
    branches: ['**']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # farkle-dev is gone: prod is the only app, deployed by deploy-prod.yml.
  # Dropping .do/app.dev.yaml alone would not remove it — the deploy action only
  # ever creates or updates apps — so this deletes it outright. Idempotent: once
  # the app is gone every later run is a no-op, and the job can be dropped.
  retire-dev:
    name: Retire farkle-dev
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Delete farkle-dev if it still exists
        run: |
          id=$(doctl apps list --output json \
               | jq -r '.[]? | select(.spec.name == "farkle-dev") | .id')
          if [ -z "$id" ]; then
            echo "farkle-dev is already gone"
            exit 0
          fi
          doctl apps delete "$id" --force
          echo "Deleted farkle-dev ($id)" >> "$GITHUB_STEP_SUMMARY"
